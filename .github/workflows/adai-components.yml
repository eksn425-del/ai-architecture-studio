name: ADAI opt-in integration checks

on:
  pull_request:
    paths:
      - "app/adai_components.py"
      - "app/project_ruby.py"
      - "app/agent_tools.py"
      - "scripts/install_adai_components.py"
      - "tests/test_adai_components.py"
      - ".github/workflows/adai-components.yml"
  workflow_dispatch:

jobs:
  verified-components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test runner
        run: python -m pip install pytest 'pydantic>=2.7,<3'
      - name: Validate Python syntax
        run: python -m compileall -q app/adai_components.py app/project_ruby.py app/agent_tools.py scripts/install_adai_components.py
      - name: Run no-network component tests
        run: python -m pytest -q tests/test_adai_components.py
