name: K Harness candidate contracts
on:
  pull_request:
    paths: ['app/**', 'scripts/**', 'tests/**', '.github/workflows/k-harness-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: python -m pip install -r requirements.txt -r requirements-model-providers.txt
      - name: Candidate contracts without paid inference or SketchUp
        run: python -m pytest -q tests/test_desktop_bootstrap.py tests/test_desktop_instance.py tests/test_desktop_lifecycle.py tests/test_desktop_distribution.py tests/test_dsh_full_profile.py tests/test_dsh_architecture_surface.py tests/test_k_architecture.py tests/test_su_harness_tools.py tests/test_deepseek_studio.py tests/test_dsh_refusal_diagnostics.py tests/test_r3_install_roots.py
      - name: Host refusal diagnostics against a local HTTP fixture
        run: node --test tests/test_dsh_refusal_diagnostics.mjs
