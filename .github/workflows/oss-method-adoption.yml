name: K AI Studio OSS method adoption regression

on:
  push:
    branches: [main]
    paths:
      - 'app/oss_method_catalog.py'
      - 'app/oss_method_runtime.rb'
      - 'app/edit_scope_guard.rb'
      - 'app/workspace_ruby.py'
      - 'app/strategy_progress.py'
      - 'app/project_ruby.py'
      - 'app/agent_tools.py'
      - 'app/construction_strategy.py'
      - 'app/image_to_sketchup_skill.py'
      - 'tests/test_oss_method_adoption.py'
      - 'tests/test_edit_scope_guard.py'
      - 'tests/test_strategy_progress.py'
      - 'tests/test_adai_components.py'
      - 'tests/test_construction_strategy.py'
      - 'tests/ruby/oss_method_runtime_test.rb'
      - 'tests/ruby/edit_scope_guard_test.rb'
      - '.github/workflows/oss-method-adoption.yml'
  pull_request:
    paths:
      - 'app/oss_method_catalog.py'
      - 'app/oss_method_runtime.rb'
      - 'app/edit_scope_guard.rb'
      - 'app/workspace_ruby.py'
      - 'app/strategy_progress.py'
      - 'app/project_ruby.py'
      - 'app/agent_tools.py'
      - 'app/construction_strategy.py'
      - 'app/image_to_sketchup_skill.py'
      - 'tests/test_oss_method_adoption.py'
      - 'tests/test_edit_scope_guard.py'
      - 'tests/test_strategy_progress.py'
      - 'tests/test_adai_components.py'
      - 'tests/test_construction_strategy.py'
      - 'tests/ruby/oss_method_runtime_test.rb'
      - 'tests/ruby/edit_scope_guard_test.rb'
      - '.github/workflows/oss-method-adoption.yml'
  workflow_dispatch:

jobs:
  adoption-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal tests
        run: python -m pip install pytest 'pydantic>=2.7,<3' pillow
      - name: Python syntax check
        run: python -m py_compile app/oss_method_catalog.py app/project_ruby.py app/strategy_progress.py app/agent_tools.py app/construction_strategy.py app/image_to_sketchup_skill.py
      - name: OSS selection and ADAI regression tests
        run: python -m pytest -q tests/test_oss_method_adoption.py tests/test_edit_scope_guard.py tests/test_strategy_progress.py tests/test_adai_components.py tests/test_construction_strategy.py
      - name: Ruby syntax and actual proxy dispatch
        run: |
          ruby -v
          ruby -c app/oss_method_runtime.rb
          ruby -c app/edit_scope_guard.rb
          ruby -c tests/ruby/oss_method_runtime_test.rb
          ruby tests/ruby/oss_method_runtime_test.rb
          ruby tests/ruby/edit_scope_guard_test.rb
